name: Refine README media layout

on:
  push:
    paths:
      - ".github/workflows/refine-readme-media.yml"

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine English and Chinese README media layout
        shell: python
        run: |
          from pathlib import Path

          for filename in ["README.md", "README.zh-CN.md"]:
              path = Path(filename)
              text = path.read_text(encoding="utf-8")

              # Remove shot04 logo card from the top real-project grid and make shot03 full width.
              if filename == "README.md":
                  old_top = '''<tr>\n<td width="50%"><img src="assets/agentjam/shot03.png" alt="AgentJAM original prototype snapshot 03" /></td>\n<td width="50%"><img src="assets/agentjam/shot04.png" alt="AgentJAM original prototype snapshot 04" /></td>\n</tr>\n<tr>\n<td><b>Built, not rendered.</b> One of the original prototype scenes.</td>\n<td><b>Working product surface.</b> A real state from the team project media set.</td>\n</tr>'''
                  new_top = '''<tr>\n<td colspan="2"><img src="assets/agentjam/shot03.png" alt="AgentJAM original prototype scene" /></td>\n</tr>\n<tr>\n<td colspan="2"><b>Built, not rendered.</b> Another real in-world state from the original AgentJAM prototype.</td>\n</tr>'''

                  old_workflow = '''<table>\n<tr>\n<td width="50%"><img src="assets/agentjam/shot05.png" alt="AgentJAM original workflow snapshot 05" /></td>\n<td width="50%"><img src="assets/agentjam/shot06.png" alt="AgentJAM original workflow snapshot 06" /></td>\n</tr>\n</table>'''
                  new_workflow = '''<table>\n<tr>\n<td width="50%"><img src="assets/agentjam/shot06.png" alt="AgentJAM agent workstation in the shared Minecraft room" /></td>\n<td width="50%"><img src="assets/agentjam/shot07.png" alt="AgentJAM collaborative coding scene" /></td>\n</tr>\n<tr>\n<td><b>Agent workstation.</b> A coding agent operating inside the shared room.</td>\n<td><b>Shared build state.</b> Another real collaboration scene from the prototype.</td>\n</tr>\n</table>'''

                  old_core = '''<table>\n<tr>\n<td width="50%"><img src="assets/agentjam/shot07.png" alt="AgentJAM original product snapshot 07" /></td>\n<td width="50%"><img src="assets/agentjam/shot08.png" alt="AgentJAM original product snapshot 08" /></td>\n</tr>\n</table>'''
                  new_core = '''<table>\n<tr>\n<td width="50%"><img src="assets/agentjam/shot08.png" alt="AgentJAM product interaction scene" /></td>\n<td width="50%"><img src="assets/agentjam/shot09.png" alt="AgentJAM shared coding environment" /></td>\n</tr>\n</table>'''

                  old_showcase = '''<table>\n<tr>\n<td width="50%"><img src="assets/agentjam/shot09.png" alt="AgentJAM original showcase snapshot 09" /></td>\n<td width="50%"><img src="assets/agentjam/shot10.png" alt="AgentJAM original showcase snapshot 10" /></td>\n</tr>\n</table>'''
                  new_showcase = '''<div align="center">\n<img src="assets/agentjam/shot10.png" alt="AgentJAM original showcase scene" width="100%" />\n</div>'''
              else:
                  old_top = '''<tr>\n<td width="50%"><img src="assets/agentjam/shot03.png" alt="AgentJAM 原始项目截图 03" /></td>\n<td width="50%"><img src="assets/agentjam/shot04.png" alt="AgentJAM 原始项目截图 04" /></td>\n</tr>\n<tr>\n<td><b>不是概念渲染图。</b> 来自当时真实原型的一帧。</td>\n<td><b>真实产品界面。</b> 来自团队项目的原始媒体素材。</td>\n</tr>'''
                  new_top = '''<tr>\n<td colspan="2"><img src="assets/agentjam/shot03.png" alt="AgentJAM 原始项目实景" /></td>\n</tr>\n<tr>\n<td colspan="2"><b>真实原型实景。</b> 来自当时 AgentJAM 在 Minecraft 世界内运行的另一帧。</td>\n</tr>'''

                  old_workflow = '''<table>\n<tr>\n<td width="50%"><img src="assets/agentjam/shot05.png" alt="AgentJAM 原始协作流程截图 05" /></td>\n<td width="50%"><img src="assets/agentjam/shot06.png" alt="AgentJAM 原始协作流程截图 06" /></td>\n</tr>\n</table>'''
                  # Handle alternate alt wording if present.
                  if old_workflow not in text:
                      old_workflow = '''<table>\n<tr>\n<td width="50%"><img src="assets/agentjam/shot05.png" alt="AgentJAM 原始项目截图 05" /></td>\n<td width="50%"><img src="assets/agentjam/shot06.png" alt="AgentJAM 原始项目截图 06" /></td>\n</tr>\n</table>'''
                  new_workflow = '''<table>\n<tr>\n<td width="50%"><img src="assets/agentjam/shot06.png" alt="AgentJAM 共享空间中的 Agent 工位" /></td>\n<td width="50%"><img src="assets/agentjam/shot07.png" alt="AgentJAM 多人协作编程实景" /></td>\n</tr>\n<tr>\n<td><b>Agent 工位。</b> 编程 Agent 真正在共享 Minecraft 房间内工作。</td>\n<td><b>共享构建状态。</b> 来自原型的另一张真实协作画面。</td>\n</tr>\n</table>'''

                  old_core = '''<table>\n<tr>\n<td width="50%"><img src="assets/agentjam/shot07.png" alt="AgentJAM 原始产品截图 07" /></td>\n<td width="50%"><img src="assets/agentjam/shot08.png" alt="AgentJAM 原始产品截图 08" /></td>\n</tr>\n</table>'''
                  if old_core not in text:
                      old_core = '''<table>\n<tr>\n<td width="50%"><img src="assets/agentjam/shot07.png" alt="AgentJAM 原始项目截图 07" /></td>\n<td width="50%"><img src="assets/agentjam/shot08.png" alt="AgentJAM 原始项目截图 08" /></td>\n</tr>\n</table>'''
                  new_core = '''<table>\n<tr>\n<td width="50%"><img src="assets/agentjam/shot08.png" alt="AgentJAM 产品交互实景" /></td>\n<td width="50%"><img src="assets/agentjam/shot09.png" alt="AgentJAM 共享编程环境" /></td>\n</tr>\n</table>'''

                  old_showcase = '''<table>\n<tr>\n<td width="50%"><img src="assets/agentjam/shot09.png" alt="AgentJAM 原始 Showcase 截图 09" /></td>\n<td width="50%"><img src="assets/agentjam/shot10.png" alt="AgentJAM 原始 Showcase 截图 10" /></td>\n</tr>\n</table>'''
                  if old_showcase not in text:
                      old_showcase = '''<table>\n<tr>\n<td width="50%"><img src="assets/agentjam/shot09.png" alt="AgentJAM 原始项目截图 09" /></td>\n<td width="50%"><img src="assets/agentjam/shot10.png" alt="AgentJAM 原始项目截图 10" /></td>\n</tr>\n</table>'''
                  new_showcase = '''<div align="center">\n<img src="assets/agentjam/shot10.png" alt="AgentJAM 原始 Showcase 实景" width="100%" />\n</div>'''

              for old, new in [(old_top,new_top),(old_workflow,new_workflow),(old_core,new_core),(old_showcase,new_showcase)]:
                  if old in text:
                      text = text.replace(old,new)

              # Add tools as compact text instead of using logo/banner images.
              marker = "`Minecraft-inspired spatial UI` · `Multi-agent collaboration` · `Voice + terminal` · `Shared project state`" if filename == "README.md" else "`Minecraft 风格空间界面` · `多 Agent 协作` · `语音 + 终端` · `共享项目状态`"
              tools = "\n\n**Prototype tools:** `Claude Code` · `Hermes Agent` · `Terminal` · `Browser`" if filename == "README.md" else "\n\n**原型工具：** `Claude Code` · `Hermes Agent` · `Terminal` · `Browser`"
              if tools.strip() not in text and marker in text:
                  text = text.replace(marker, marker + tools)

              path.write_text(text, encoding="utf-8")

      - name: Commit README cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "docs: remove non-product media from README layout"
          git push
