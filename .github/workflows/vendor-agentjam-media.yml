name: Localize AgentJAM media

on:
  push:
    paths:
      - ".github/workflows/vendor-agentjam-media.yml"

permissions:
  contents: write

jobs:
  localize-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout showcase repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vendor original AgentJAM recording
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/agentjam
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/harrythentrepreneur/vibecode-together/main/landing/videos/agentjam.mp4?token=BMXQOLQT4NNUB4RHG6VR3N3KS7OBBAA" \
            -o assets/agentjam/agentjam.mp4

      - name: Switch READMEs to local media
        shell: python
        run: |
          from pathlib import Path

          source = "https://raw.githubusercontent.com/harrythentrepreneur/vibecode-together/main/landing/images/aj/"
          video_source = "https://github.com/harrythentrepreneur/vibecode-together/blob/main/landing/videos/agentjam.mp4"

          for filename in ["README.md", "README.zh-CN.md"]:
              path = Path(filename)
              text = path.read_text(encoding="utf-8")

              for i in range(1, 11):
                  name = f"shot{i:02d}.png"
                  text = text.replace(source + name, f"assets/agentjam/{name}")

              text = text.replace(video_source, "assets/agentjam/agentjam.mp4")

              # Remove the old wording that said the media was only externally referenced.
              text = text.replace(
                  "Original project media is referenced directly from the team project repository and shown here as part of Lavine's authorized project showcase. The media files are not re-hosted in this showcase repository.",
                  "Original team-project media, now vendored into this showcase repository for Lavine's authorized portfolio presentation."
              )
              text = text.replace(
                  "上述原始项目媒体直接引用自团队项目仓库，并基于 Lavine 对该项目成果的展示权用于个人项目展示；媒体文件本身没有重新复制或托管到这个 Showcase 仓库。",
                  "上述素材来自原团队项目，并已放入本 Showcase 仓库，用于 Lavine 获授权的个人作品集与项目展示。"
              )
              text = text.replace(
                  "The original AgentJAM screenshots and recording shown above are **referenced directly from the team project repository** for portfolio presentation; they are not copied into this showcase repository.",
                  "The original AgentJAM screenshots and recording are included in this repository for authorized portfolio presentation of the team-created project."
              )
              text = text.replace(
                  "上面展示的 AgentJAM 原始截图和录屏，均**直接引用自团队项目仓库**用于作品集展示，并没有把原始媒体文件重新复制进这个 Showcase 仓库。",
                  "上面展示的 AgentJAM 原始截图和录屏来自团队项目素材，并已放入本仓库，用于获授权的作品集展示。"
              )

              path.write_text(text, encoding="utf-8")

      - name: Commit localized media and README fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/agentjam README.md README.zh-CN.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "fix: use local AgentJAM media in READMEs"
          git push
