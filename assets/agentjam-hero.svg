<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AgentJAM — Multiplayer AI coding in a shared 3D room</title>
  <desc id="desc">A pixel-inspired diagram showing three human and AI workstations connected to a shared project wall.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110f"/>
      <stop offset="1" stop-color="#0f2520"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#173b31" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="630" rx="28" fill="url(#grid)" opacity=".7"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="70" y="100" fill="#79ff8f" font-size="22" letter-spacing="3">MULTIPLAYER AI CODING SPACE</text>
    <text x="70" y="175" fill="#effff4" font-size="72" font-weight="800">AgentJAM</text>
    <text x="72" y="220" fill="#a6c8b7" font-size="24">Humans + agents build software in the same room.</text>

    <g transform="translate(70 292)">
      <rect width="250" height="190" rx="8" fill="#102a23" stroke="#315e4f" stroke-width="2"/>
      <rect x="22" y="22" width="206" height="70" rx="4" fill="#06100d" stroke="#52d8ff"/>
      <text x="38" y="53" fill="#52d8ff" font-size="16">AGENT / A</text>
      <text x="38" y="78" fill="#a6c8b7" font-size="13">editing auth.ts</text>
      <rect x="34" y="118" width="62" height="42" fill="#79ff8f"/>
      <rect x="112" y="118" width="104" height="12" fill="#29483d"/>
      <rect x="112" y="142" width="76" height="12" fill="#29483d"/>
      <text x="22" y="180" fill="#7da897" font-size="12">voice + terminal</text>
    </g>

    <g transform="translate(355 292)">
      <rect width="250" height="190" rx="8" fill="#102a23" stroke="#315e4f" stroke-width="2"/>
      <rect x="22" y="22" width="206" height="70" rx="4" fill="#06100d" stroke="#79ff8f"/>
      <text x="38" y="53" fill="#79ff8f" font-size="16">AGENT / B</text>
      <text x="38" y="78" fill="#a6c8b7" font-size="13">building UI</text>
      <rect x="34" y="118" width="62" height="42" fill="#52d8ff"/>
      <rect x="112" y="118" width="104" height="12" fill="#29483d"/>
      <rect x="112" y="142" width="88" height="12" fill="#29483d"/>
      <text x="22" y="180" fill="#7da897" font-size="12">owned task boundary</text>
    </g>

    <g transform="translate(640 292)">
      <rect width="250" height="190" rx="8" fill="#102a23" stroke="#315e4f" stroke-width="2"/>
      <rect x="22" y="22" width="206" height="70" rx="4" fill="#06100d" stroke="#ffd166"/>
      <text x="38" y="53" fill="#ffd166" font-size="16">AGENT / C</text>
      <text x="38" y="78" fill="#a6c8b7" font-size="13">running tests</text>
      <rect x="34" y="118" width="62" height="42" fill="#ffd166"/>
      <rect x="112" y="118" width="104" height="12" fill="#29483d"/>
      <rect x="112" y="142" width="66" height="12" fill="#29483d"/>
      <text x="22" y="180" fill="#7da897" font-size="12">live status + diff</text>
    </g>

    <g transform="translate(925 260)">
      <rect width="205" height="255" rx="10" fill="#091713" stroke="#79ff8f" stroke-width="3" filter="url(#glow)"/>
      <text x="24" y="38" fill="#79ff8f" font-size="14">SHARED PROJECT WALL</text>
      <rect x="24" y="58" width="157" height="72" fill="#102a23" stroke="#315e4f"/>
      <text x="38" y="84" fill="#52d8ff" font-size="12">PREVIEW</text>
      <rect x="38" y="96" width="94" height="8" fill="#79ff8f"/>
      <rect x="38" y="112" width="121" height="6" fill="#29483d"/>
      <rect x="24" y="146" width="157" height="70" fill="#102a23" stroke="#315e4f"/>
      <text x="38" y="171" fill="#ffd166" font-size="12">DIFF + TESTS</text>
      <text x="38" y="194" fill="#a6c8b7" font-size="11">+ 28  - 4   ✓ 12/12</text>
      <text x="24" y="239" fill="#7da897" font-size="11">one shared source of truth</text>
    </g>

    <path d="M320 385 H925 M605 385 H925 M890 385 H925" fill="none" stroke="#52d8ff" stroke-width="3" stroke-dasharray="8 10" opacity=".9"/>
    <circle cx="925" cy="385" r="7" fill="#79ff8f" filter="url(#glow)"/>

    <text x="70" y="560" fill="#effff4" font-size="20" font-weight="700">Google Docs for code — spatial, voice-driven, agent-native.</text>
    <text x="70" y="592" fill="#7da897" font-size="15">Interactive concept showcase · Minecraft-inspired collaboration interface</text>
  </g>
</svg>